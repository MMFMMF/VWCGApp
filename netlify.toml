# Domain redirect: businessadvisors.app → vwcg.app
[[redirects]]
  from = "https://businessadvisors.app/*"
  to = "https://vwcg.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.businessadvisors.app/*"
  to = "https://vwcg.app/:splat"
  status = 301
  force = true

# Domain redirect: *.vwcg.app → vwcg.app
[[redirects]]
  from = "https://*.vwcg.app/*"
  to = "https://vwcg.app/:splat"
  status = 301
  force = true
