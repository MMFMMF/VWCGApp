[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirects for SPA-like behavior on /app routes
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 301 redirects from old vwcg.app /guide/* URLs to new /blog/* slugs
[[redirects]]
  from = "/guide/sop-creation-guide-templates-tools-best-practices"
  to = "/blog/sop-creation-guide"
  status = 301

[[redirects]]
  from = "/guide/what-is-swot-analysis-tool"
  to = "/blog/swot-analysis-tool"
  status = 301

[[redirects]]
  from = "/guide/business-roadmap-guide-90-day-template"
  to = "/blog/90-day-business-roadmap"
  status = 301

[[redirects]]
  from = "/guide/5-best-sop-management-tools-2025"
  to = "/blog/best-sop-management-tools-2025"
  status = 301

[[redirects]]
  from = "/guide/what-happens-when-a-business-is-not-ready-for-ai"
  to = "/blog/business-not-ready-for-ai"
  status = 301

# Domain redirect: businessadvisors.app → vwcg.app
[[redirects]]
  from = "https://businessadvisors.app/*"
  to = "https://vwcg.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://*.businessadvisors.app/*"
  to = "https://vwcg.app/:splat"
  status = 301
  force = true
