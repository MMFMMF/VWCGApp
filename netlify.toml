[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA-like behavior on /assessment routes
[[redirects]]
  from = "/assessment/*"
  to = "/assessment/index.html"
  status = 200

# 301 redirect: old /app/* URLs → /assessment/
[[redirects]]
  from = "/app/*"
  to = "/assessment/:splat"
  status = 301
  force = true

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 301 redirects: replaced blog posts → new slugs
[[redirects]]
  from = "/blog/sop-creation-guide"
  to = "/blog/sop-maturity-why-documented-processes-not-working"
  status = 301

[[redirects]]
  from = "/blog/90-day-business-roadmap"
  to = "/blog/90-day-roadmap-quarterly-execution-beats-annual-planning"
  status = 301

[[redirects]]
  from = "/blog/swot-analysis-tool"
  to = "/blog/swot-analysis-small-business-changes-decisions"
  status = 301

# 301 redirects: deleted blog posts → best replacement
[[redirects]]
  from = "/blog/business-not-ready-for-ai"
  to = "/blog/ai-readiness-assessment-company-ready"
  status = 301

[[redirects]]
  from = "/blog/best-sop-management-tools-2025"
  to = "/blog/sop-maturity-why-documented-processes-not-working"
  status = 301

[[redirects]]
  from = "/blog/why-assess-business"
  to = "/blog/strategic-business-assessment-cost"
  status = 301

[[redirects]]
  from = "/blog/sample-post"
  to = "/blog"
  status = 301

# 301 redirects from old vwcg.app /guide/* URLs to new /blog/* slugs
[[redirects]]
  from = "/guide/sop-creation-guide-templates-tools-best-practices"
  to = "/blog/sop-maturity-why-documented-processes-not-working"
  status = 301

[[redirects]]
  from = "/guide/what-is-swot-analysis-tool"
  to = "/blog/swot-analysis-small-business-changes-decisions"
  status = 301

[[redirects]]
  from = "/guide/business-roadmap-guide-90-day-template"
  to = "/blog/90-day-roadmap-quarterly-execution-beats-annual-planning"
  status = 301

[[redirects]]
  from = "/guide/5-best-sop-management-tools-2025"
  to = "/blog/sop-maturity-why-documented-processes-not-working"
  status = 301

[[redirects]]
  from = "/guide/what-happens-when-a-business-is-not-ready-for-ai"
  to = "/blog/ai-readiness-assessment-company-ready"
